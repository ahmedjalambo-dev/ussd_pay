# Config for the `flutter_native_splash` generator. Regenerate the native
# drawables and styles after editing this file with:
#   dart run flutter_native_splash:create
#
# The images come from tool/generate_icons.py (the "#" brand mark); run that
# first if the mark or the brand colour changes.
#
# Android-only: CLAUDE.md scopes this app to Android; iOS/web splash
# generation is intentionally off.
flutter_native_splash:
  # Backgrounds match AppTheme's surfaces (_lightSurface / _darkSurface) so
  # there is no visible seam when the app opens over the splash. The app
  # defaults to dark, so the dark splash is the one most users see.
  color: "#F5F7FB"
  color_dark: "#0B1220"

  # The "#" on a disc in the app's own colorScheme.primary, per mode, so the
  # splash flows straight into the app: #314377 with a white mark (light),
  # #B4C5FF with a #061D50 mark (dark). Android <= 11 uses these images.
  image: assets/branding/splash_mark_light.png
  image_dark: assets/branding/splash_mark_dark.png

  # The "USSD Pay" wordmark sits at the bottom, in the splash's branding
  # slot: the Android 12+ system splash allows nothing else besides the
  # centred icon, and using the same slot everywhere keeps every Android
  # version looking the same. Neutral ink per mode, so the blue "#" stays the
  # only colour.
  branding: assets/branding/branding_light.png
  branding_dark: assets/branding/branding_dark.png
  branding_mode: bottom
  # Lifts the name off the gesture bar on Android 11 and older.
  branding_bottom_padding_android: 24

  android: true
  ios: false
  web: false

  # Android 12+ uses the system splash API: a centred icon, mask-clipped to a
  # circle, plus the bottom branding image. The image is only the mark;
  # icon_background_color draws the primary disc behind it.
  android_12:
    color: "#F5F7FB"
    color_dark: "#0B1220"
    image: assets/branding/splash_mark_a12_light.png
    image_dark: assets/branding/splash_mark_a12_dark.png
    icon_background_color: "#314377"
    icon_background_color_dark: "#B4C5FF"
    branding: assets/branding/branding_light.png
    branding_dark: assets/branding/branding_dark.png
