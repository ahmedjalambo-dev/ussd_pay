name: ussd_pay
description: "USSD Pay — offline-first mobile-wallet payments via USSD."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (manual providers — no codegen).
  flutter_riverpod: ^3.4.2

  # Local storage. hive_ce is the maintained fork; the original hive is abandoned.
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Holds the Hive AES key in the Android Keystore.
  # Held below 11.x: 11.0.0 compiles against Android SDK 37, which Flutter 3.44
  # does not target and which Gradle looks up as the hash "android-37" (the
  # installed platform is "android-37.0", so the lookup fails). 10.x compiles
  # against SDK 36 and has the same Keystore-backed API surface we use.
  flutter_secure_storage: ">=10.3.1 <11.0.0"

  # Hands the built USSD code to the system dialer.
  url_launcher: ^6.3.2

  # Native contact picker (also exposes its own permission request).
  flutter_contacts: ^2.3.1

  # Pinned to 0.20.2 by flutter_localizations in the Flutter 3.44 SDK.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/wallets.json
    - assets/images/

  # IBM Plex Sans (SIL OFL 1.1, see assets/fonts/IBM_Plex_Sans/OFL.txt) for
  # Latin, IBM Plex Sans Arabic (assets/fonts/IBM_Plex_Sans_Arabic/OFL.txt) for
  # Arabic glyphs. Bundled rather than fetched at runtime: the app makes no
  # network calls, and a font that fails to download would leave the UI in a
  # fallback face.
  #
  # Static instances, not the variable TTF -- Flutter selects a face by
  # `fontWeight`, and a variable font would render at its default weight
  # everywhere. The Arabic family is wired as a fontFamilyFallback in
  # AppTheme, so Arabic glyphs pick it up automatically regardless of locale.
  # USSD codes are exempt: they stay monospace, see AppTheme.ussdCode.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBM_Plex_Sans/static/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM_Plex_Sans/static/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBM_Plex_Sans/static/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBM_Plex_Sans/static/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
